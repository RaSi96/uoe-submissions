name: Build PDFs & Release

on:
  workflow_dispatch:
  push:
    branches:
        - '**'
    paths:
      - '**.md'
      - '**.bib'
      - '**.tex'
      - '**.csl'
      - '**.theme'
      - 'Makefile'
      - '**/Makefile'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          pandoc \
          texlive-xetex texlive-latex-extra texlive-fonts-recommended \
          fonts-liberation \
          fonts-hack

      - name: Build all PDFs
        run: make

      - name: Collect PDFs (preserve structure)
        run: |
          mkdir output
          find . -name "*.pdf" -exec cp --parents {} output/ \;

      - name: Create zip
        run: |
          cd output
          zip -r ../submissions.zip .

      - name: Release zip
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest PDFs
          files: submissions.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}